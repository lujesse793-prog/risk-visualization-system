function doQueryAll(){
	var searchText = $.trim($('#searchText').val());
	//alert(searchText);
	if(searchText.length == 0){
		alert("关键字不能为空");
		return false;
	}else{
		var validate = doValidate(searchText);
		if(validate==-1){
			return false;
		}
	}
	var choiceDate = $('input[name="dates"]:checked').val();
	//alert(choiceDate);
	if(choiceDate=='-1'){
		 startDate = $('#psawf-start-date').val();
		 endDate = $('#psawf-end-date').val(); 
		 if(startDate==''&&endDate==''){
	    		alert("请填写时间范围");
	    		return false;
	    	} 
	    	if(startDate==''){
	    		alert("搜索开始时间不能为空");
	    		return false;
	    	}  	
	    	if(endDate==''){
	    		alert("搜索结束时间不能为空");
	    		return false;
	    	}
	    	var start =new Date(startDate.replace(/-/g,"/"));
	    	var end = new Date(endDate.replace(/-/g,"/"));
	    	times = end.getTime()-start.getTime();
	    	if(times/(1000*60*60*24)>(366*3)){
		   		alert("搜索时间间隔不能超过3年");
		   		return false;
		   	}
	}else{
		date = choiceDate;
		startDate='';
		endDate='';
		}
	var args;
	//TODO:处理下拉框，获取所选的栏目id
		var map2=$("#select-map").data("result");
		//console.log(map2);
	var rootChannelId =$("#selectChannels").val();

		alert("请选择栏目范围");
		return false;
	}else if(rootChannelId=='全部'){
		for (var key in map2) {  
			selectIds+=map2[key]+",";
			}
	}else{
		for (i=0;i<strs.length ;i++ ){
			selectIds+=map2[strs[i]]+",";		
			}
	
		}
	
	var isTitle= document.getElementById("containTitle").checked;
	var isTxt = document.getElementById("containTitle1").checked;

//校验搜索值  
function doValidate(param){
	var patrn=/[\"\'*@+&$%|\\']/;
	if(patrn.exec(param)){
		alert("查询信息不能包含特殊字符");
	    return -1;			
	}   	
	    	
}

function getLT(){
        //其中添加获取用户信息lt by jzj 2018-10-25
        var arrObj = new Array();
        var ut;
		var sign;
     $.ajax({
             url:LSS_URL+"cm-s-account/getLT",                
                        type: "post",
                        dataType: 'json',
                        data:{'type':'0'},
                        cache: false,
                        async:false,
                        success: function(data) {
                            ut = encodeURI(data.data.UT).replace(/\+/g,'%2B');
                            sign = encodeURI(data.data.sign).replace(/\+/g,'%2B');
							
						    user=data.data.user;
						    if(user!=null && null!=user.dense){
							   dense = user.dense;
						    }
							infoLevel=dense;
            }
     });        
		 arrObj.push(ut);
		 arrObj.push(sign);
         return arrObj;
}
