//分页跳转
function pageChange2(data){
	op = 'top';
	if(data == 'first'){
		pageIndex2 = 1;
		op = 'top';
		searchAfter = [];
	}
	else if(data == 'previous'){
		pageIndex2 = pageIndex2-1;
		op = 'prev';
		searchAfter = sortPrevStore2;
	}
	else if(data == 'next'){
		pageIndex2 = pageIndex2+1;
		op = 'next';
		searchAfter = sortNextStore2;
	}
	else if(data == 'last'){
		pageIndex2 = pageCount2;
		searchAfter = [];
	}
	else{
		pageIndex2 = data;
		searchAfter = [];
	}
	if(data>pageCount2){
		pageIndex2 = pageCount2;
	}
	if(data<=0){
		pageIndex2 = 1;
		return false;
	}
	param = $("#sTextStore").val();
	param1 = $("#cIdStrStore").val();
	param2 = $("#methodStore").val();
	param3 = $("#nLevelStore").val();
	doSearchPage2(param,param1,param2,param3,op,searchAfter);
	//回到顶部
	$("html,body").animate({scrollTop: 0}, 100);
}

// 替换查询字符串样式 
function replaceWords(str){
	if(str==null){
		var searchText = $("#searchText").val();
		return "<font color='red'>"+searchText+"</font>";
	}
	var str_new=str;
	var str_cut = str;
	if($.trim($('#searchText').val())!=''){
		var searchText = $.trim($('#searchText').val()).split(' ');
		if(searchText.length>0){
			for(var i=0;i<searchText.length;i++){
				var str1_new='';
				var str1 = str_new;
				var word_lower = searchText[i].toLowerCase();
				var str_lower = str1.toLowerCase();
				if(str_lower.indexOf(word_lower)<0){
					str1_new = str_new;
				}else{
					while(str_lower.indexOf(word_lower)>=0){
						var index = str_lower.indexOf(word_lower);
						var old_title = str1.substring(index,index+word_lower.length);
						str1_new += str1.substring(0,index+word_lower.length).replace(old_title,'<font color="red">'+old_title+'</font>');
						str_lower = str_lower.substring(index+word_lower.length);
						str1 = str1.substring(index+word_lower.length);
					}
					if(str_lower.lastIndexOf(word_lower)+word_lower.length<str_cut.length){
						str1_new += str_cut.substring(str_cut.toLowerCase().lastIndexOf(word_lower)+word_lower.length);
					}
				}
				str_cut = str1_new;
				str_new = str1_new;
			}
		}
	}
	return str_new;
}

/* 获取主机地址，并生成文章地址 */
function getUrl(channelPath,articleId,date){
	var curWwwPath = window.document.location.href;
	var pathName = window.document.location.pathname;
	var pos = curWwwPath.indexOf(pathName);
	var localHostPath = curWwwPath.substring(0,pos);
	return localHostPath+'/chinese/'+channelPath+'/'+date+'/'+articleId+'.html?cp='+channelPath;
}
function getUrl2(link){
	var curWwwPath = window.document.location.href;
	var pathName = window.document.location.pathname;
	var pos = curWwwPath.indexOf(pathName);
	var localHostPath = curWwwPath.substring(0,pos);
	return localHostPath+link;
}

function getTxtExist(contentId){

	$.ajax({

	});

}

//获取多条稿件的正文相关信息
function setContentTxtInfo(d){
	var contentIds="";
	var size = d.length;
	$.each(d,function(i,n){
		var contentId = n["id"];
		if(i != (size-1)){
			contentIds += contentId+",";
		}else{
			contentIds += contentId;
		}
	});	
	var jsonStr="";
	$.ajax({
		url:NT_URL+"/cm-s-notice-query/draftInfo",
        data:{"contentIds":contentIds},
		type:"POST",
		dataType : 'json',
		cache : false,
		async:false,
		success:function(data){
			var size = 0;
			if(data.data!=null){
				size = data.data.size;
			}			
			var suffix = "";
			var downloadHref = "";
			var href = "";
			
			$.each(data.records,function(i,n){
				
				var contentId = n.contentId;
				//是否存在正文
				var txt = n.txt;
				
				if(i != (size-1)){
					jsonStr += '{"contentId":"'+contentId+'","txt":"'+txt+'"},';
				}else{
					jsonStr += '{"contentId":"'+contentId+'","txt":"'+txt+'"}';
				}
				
			});
		}
	});
	var jsonStr = '['+jsonStr+']';
	var json = JSON.parse(jsonStr);
	return json;
}
function getContentTxtInfoById(json,id,size){	
	var arr;

		arr = json[i];
		var contentId = arr.contentId;

	}
	
	return arr.txt;
}
