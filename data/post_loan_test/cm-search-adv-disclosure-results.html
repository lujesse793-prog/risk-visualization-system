function setSheetWidth($sheet) {
        var $tr = $sheet.find('thead:eq(0)>tr').children(),
            // 各列宽度
            w = [], _w;
        $tr.each(function(i){
            switch (i) {
                case 0:
                    _w = 180;
                    if (MEDIA_CASE == 'XS') {
                        _w = 150;
                    }
                    break;
                case 2:
                    _w = 220;
                    break;
                default:
                    _w = 110;
                    break;
            }
            w.push(_w);
        });
        return w;
    }

function creatData(t1,t2,t3,t4,t5) {
	var o =new Object();
		o.entyDefinedCode=t1;//序号用

		o.infoPublishType=t3;//信息披露类型
		o.entyDefinedCodeStr=t4;//id跳转用
		o.selectType=t5;//select类型
		return o;
}
