function addBondNote(){
	 //获取悬浮注释

			type : "get",//无此配置，提交中文乱码

function initBondBaseInfoSearchCondition() {
	$.ajax({
		url:NT_URL + "/cm-u-bond-md/BondBaseInfoSearchCondition",
        type:"POST",
        dataType:'json',
        cache:false,
        success:function(data){
        	var bondType = "";
            var bondTypeLen = data.data.bondType.length;
            for(var i=0; i<bondTypeLen; i++){
            	bondType += "<option value='"+data.data.bondType[i].bondTypeCode+"'>"+data.data.bondType[i].bondDisplayType+"</option>";
            }
            $("#psa-bond-bond-type").append(bondType);
            var couponType = "";
            var couponTypeLen = data.data.couponType.length;
            for(var i=0; i<couponTypeLen; i++){
            	couponType += "<option value='"+data.data.couponType[i].couponTypeCode+"'>"+data.data.couponType[i].couponType+"</option>";
            }
            $("#psa-bond-coupon-type").append(couponType);
            var issueYear = "";
            var issueYearLen = data.data.issueYear.length;
            for(var i=issueYearLen-2; i>=0; i--){
            	issueYear += "<option value='"+data.data.issueYear[i]+"'>"+data.data.issueYear[i]+"</option>";
            }
            $("#psa-bond-issue-year").append(issueYear);
            var bondRtngShrt = "";
            var bondRtngShrtLen = data.data.bondRtngShrt.length;
            for(var i=0; i<bondRtngShrtLen; i++){
            	bondRtngShrt += "<option value='"+data.data.bondRtngShrt[i]+"'>"+data.data.bondRtngShrt[i]+"</option>";
            }
            $("#psa-bond-issue-rtng-shrt").append(bondRtngShrt);
            
            /*var bondSpclPrjctVrty = "";
            var bondSpclPrjctVrtyLen = data.data.bondSpclPrjctVrty.length;
            for(var i=0; i<bondSpclPrjctVrtyLen; i++){
            	if(data.data.bondSpclPrjctVrty[i].bondTypeCode!="605" && data.data.bondSpclPrjctVrty[i].bondTypeCode!="606" && data.data.bondSpclPrjctVrty[i].bondTypeCode!="607"){
                	bondSpclPrjctVrty += "<option value='"+data.data.bondSpclPrjctVrty[i].bondTypeCode+"'>"+data.data.bondSpclPrjctVrty[i].bondDisplayType+"</option>";
            	}
            }
            $("#psa-bond-bondSpclPrjctVrty").append(bondSpclPrjctVrty);*/
            
        }        
	});
}

function initEntyFullName() {
	$.ajax({
		url:NT_URL + "/cm-u-bond-md/EntyFullNameSearchCondition",
        type:"POST",
        dataType:'json',
        cache:false,
        success:function(data){
            var enty = "";
            var entyLen = data.data.enty.length;
            for(var i=0; i<entyLen; i++){
            	enty += "<option value='"+data.data.enty[i].entyDefinedCode+"'>"+data.data.enty[i].entyFullName+"</option>";
            }
            $("#psa-bond-enty").append(enty);
        }        
	});
}

//搜索
function renderData_new(pageNo){
	$("#bond-info-tb").empty();
	$("#bond-search-condition").html();
    $("#bond-result-count").html();
	var bondName = document.getElementById("psa-bond-bond-name").value;
	var bondCode = document.getElementById("psa-bond-bond-code").value;
	var issueEnty = document.getElementById("psa-bond-issue-enty").value;
	var patrn=/[\"\'<>``!@#$%^&*+-\/\/\/\\//?,.]/;
	var bondNoteText=$('#noteText span').html()+""=="undefined"?"''":$('#noteText span').html();
	if(patrn.exec(bondName)){
		alert("查询信息不能包含特殊字符!!");
		document.getElementById("psa-bond-bond-name").focus();
		return false;			
	}
	if(patrn.exec(bondCode)){
		alert("查询信息不能包含特殊字符!!");
		document.getElementById("psa-bond-bond-code").focus();
		return false;			
	}
	if(patrn.exec(issueEnty)){
		alert("查询信息不能包含特殊字符!!");
		document.getElementById("psa-bond-issue-enty").focus();
		return false;			
	}
	bondName=bondName.replace('_', "\\_");
	bondCode=bondCode.replace('_', "\\_");
	issueEnty=issueEnty.replace('_', "\\_");
	
	var bondType = $("#psa-bond-bond-type").val();
	//var bondSpclPrjctVrty = $("#psa-bond-bondSpclPrjctVrty").val();
	var bondSpclPrjctVrty ="";
	var couponType = $("#psa-bond-coupon-type").val();
	var issueYear = $("#psa-bond-issue-year").val();
	var entyDefinedCode = $("#psa-bond-enty").val();
	var rtngShrt = $("#psa-bond-issue-rtng-shrt").val();
	
	var $sheet = $('#sheet-search-market-results'),
	//sheet-search-market-results,sheet-bond-market
        $pagi = $('#pagi-search-market-results');

    var sheetSet = getsheetWidthCase($sheet, setSheetWidth($sheet)),
        rw = sheetSet.width,
        strCol = sheetSet.colHtml;
    $sheet.find('colgroup').html(strCol);
	
	san.tools.getJsonData({
        url: NT_URL + "/cm-u-bond-md/BondMarketInfoList2",
		type: "POST",
		timestamp: false,
        data: {
        		"pageNo":pageNo,
        		"pageSize":"15",
        		"bondName":bondName,
        		"bondCode":bondCode,
        		"issueEnty":issueEnty,
        		"bondType":bondType,
				"bondSpclPrjctVrty":bondSpclPrjctVrty,
        		"couponType":couponType,
        		"issueYear":issueYear,
        		"entyDefinedCode":entyDefinedCode,
        		"rtngShrt":rtngShrt
        		},
        onDone: function(data){
            var _data = data.data,
                records = _data.resultList;
				//console.log(_data.resultList);
            $('#bond-market-search-total').text(_data.total);
			var pgTotal = data.data.pageTotal;
        	var rdTotal = data.data.total;
            var conditionStr = "";
            if(""!=bondName){
            	conditionStr += bondName;
            }
            if(""!=bondCode) {
            	if(conditionStr.length>0) {
            		conditionStr += " ";
            	}
            	conditionStr += bondCode;
            }
            if(""!=issueEnty) {
            	if(conditionStr.length>0) {
            		conditionStr += " ";
            	}
            	conditionStr += issueEnty;
            }
			//如果为一条数据，跳转详细信息
			var bondBaseInfoLen = _data.total;
			if(bondBaseInfoLen==1) {
				// 判断是否为大额存单
				if("100058"==records[0].bondTypeCode) {
					window.open("/chinese/decdn/?bondDefinedCode=" + records[0].bondDefinedCode);
				} else if("100060"==records[0].bondTypeCode || "100081"==records[0].bondTypeCode){
					window.open("/chinese/hspzyljpj/?bondDefinedCode=" + records[0].bondDefinedCode);
				} else {
					window.open("/chinese/zqjc/?bondDefinedCode=" + records[0].bondDefinedCode);
				}
			}			
			
        
            $sheet.sanDatasheet({
                dataSource: 'local',
                url: records,
                dataHandler: function(data){
                    var $sheet = this;
                    $.each(data, function(n, v){
                       // 判断是否为大额存单
						if("100058"==v.bondTypeCode) {
						  if(v.inptTp+""=="2"){
							  //bondBaseInfo += '<td class="cell p-l-10"><span class="cell-value pd">' + hrefStr + sanCharEntity(data[i].bondName) + '</a></span><div title='+bondNoteText+'   class="tb"></div></td>'; 
							   v.bondName = '{{html}}<a href="/chinese/decdn/?bondDefinedCode='+v.bondDefinedCode+'" target="_blank" title="' + v.bondName + '">' + v.bondName + '</a></span><div class="tb" title='+bondNoteText+'></div></td>';
						  }	else{
								v.bondName = '{{html}}<a href="/chinese/decdn/?bondDefinedCode='+v.bondDefinedCode+'" target="_blank" title="' + v.bondName + '">' + v.bondName + '</a>';
						  }							
						} else if("100060"==v.bondTypeCode || "100081"==v.bondTypeCode){
							 if(v.inptTp+""=="2"){
								  v.bondName = '{{html}}<a href="/chinese/hspzyljpj/?bondDefinedCode='+v.bondDefinedCode+'" target="_blank" title="' + v.bondName + '">' + v.bondName + '</a></span><div title='+bondNoteText+'   class="tb"></div></td>';
								 }else{
								  v.bondName = '{{html}}<a href="/chinese/hspzyljpj/?bondDefinedCode='+v.bondDefinedCode+'" target="_blank" title="' + v.bondName + '">' + v.bondName + '</a>';
								 }
								
							}
						else {
							 if(v.inptTp+""=="2"){
							  v.bondName = '{{html}}<a href="/chinese/zqjc/?bondDefinedCode='+v.bondDefinedCode+'" target="_blank" title="' + v.bondName + '">' + v.bondName + '</a></span><div title='+bondNoteText+'   class="tb"></div></td>';
							 }else{
							  v.bondName = '{{html}}<a href="/chinese/zqjc/?bondDefinedCode='+v.bondDefinedCode+'" target="_blank" title="' + v.bondName + '">' + v.bondName + '</a>';
							 }
							
						}
						
                       if(v.entyFullName!=null){
                    	   v.entyFullName = '{{html}}<a href="/chinese/jgxxpl/?entyDefinedCode=' + v.entyDefinedCode + '" target="_blank" title="' + v.entyFullName + '">' + v.entyFullName + '</a>';   
                       }else{
                    	   v.entyFullName = '---';
                       }
                        
                    });
					$("#bond-search-condition").html(conditionStr);
					$("#bond-result-count").html(rdTotal);
					$pagi.sanPagination();
					pagination3("pagi-search-market-results",pgTotal,rdTotal,pageNo);
					$('#bond-search-result1').show();					
                    return _example_dataFormatter($sheet, '', data);
                },
                mediaListening: true,
                onMediaChange: function(){
                    var newOpt = {
                        fixedLayout: true,
                        fixedLayoutType: 'column',
                        fixedBodyWidth : rw
                    }
                    sheetSet = getsheetWidthCase($sheet, setSheetWidth($sheet));
                    rw = sheetSet.width;
                    strCol = sheetSet.colHtml;
                    $sheet.find('colgroup').html(strCol);
                    return {
                        'XL': {
                            fixedLayout: false
                        },
                        'default': newOpt
                    }
                }
            });
			
			
			
			
            
        }
    });
	
}

function setSheetWidth($sheet) {
        var $tr = $sheet.find('thead:eq(0)>tr').children(),
            // 各列宽度
            w = [], _w;
        $tr.each(function(i){
            switch (i) {
                case 0:
                    _w = 180;
                    if (MEDIA_CASE == 'XS') {
                        _w = 150;
                    }
                    break;
                case 2:
                    _w = 220;
                    break;
                case 3:
                    _w = 160;
                    break;
                case 5:
                    _w = 130;
                    break;
                default:
                    _w = 110;
                    break;
            }
            w.push(_w);
        });
        return w;
    }
</script>
