          if (row.riskLevel === "严重") current.severe += 1;
          else if (row.riskLevel === "较重") current.high += 1;
          else if (row.riskLevel === "关注") current.watch += 1;
          if (RISK_ORDER[row.riskLevel] > RISK_ORDER[current.maxRisk]) current.maxRisk = row.riskLevel;

        return Array.from(map.values()).sort((a, b) => b.severe - a.severe || b.high - a.high || b.value - a.value);

        const filteredProjects = projects.filter((project) => {
          const haystack = [project.project, project.borrower, project.guarantor].join(" ");
          return haystack.toLowerCase().includes(projectQuery.trim().toLowerCase());
        });
        const projectPageSize = 4;
        const projectTotalPages = Math.max(1, Math.ceil(filteredProjects.length / projectPageSize));
        const currentProjectPage = Math.min(projectPage, projectTotalPages);
        const visibleProjects = filteredProjects.slice(
          (currentProjectPage - 1) * projectPageSize,
          currentProjectPage * projectPageSize
        );
        const projectPagerItems = (() => {
          if (projectTotalPages <= 7) {
            return Array.from({ length: projectTotalPages }, (_, index) => index + 1);
          }
          const items = [1];
          const start = Math.max(2, currentProjectPage - 1);
          const end = Math.min(projectTotalPages - 1, currentProjectPage + 1);
          if (start > 2) items.push("left-ellipsis");
          for (let pageNumber = start; pageNumber <= end; pageNumber += 1) {
            items.push(pageNumber);
          }
          if (end < projectTotalPages - 1) items.push("right-ellipsis");
          items.push(projectTotalPages);
          return items;
        })();

        React.useEffect(() => {
          setProjectPage(1);

                            >
                              {pageNumber}
                            </button>
                            )

                          <button

                            disabled={currentProjectPage === projectTotalPages}
                            onClick={() => setProjectPage((page) => Math.min(projectTotalPages, page + 1))}

        const severeWorkbenchCount = workbenchAlerts.filter((item) => item.level === "严重").length;
        const highWorkbenchCount = workbenchAlerts.filter((item) => item.level === "较重").length;
        const workbenchPageSize = 5;

        const visibleWorkbenchAlerts = workbenchAlerts.slice(
          (currentWorkbenchPage - 1) * workbenchPageSize,

        );

        const filteredAlerts = appAlerts.filter((item) => {
          const haystack = [item.project, item.entity, item.role, item.title, item.summary, item.sources.join(" ")].join(" ");
          const daysAgo = (new Date("2026-05-27") - new Date(item.time)) / (1000 * 60 * 60 * 24);
          const queryMatch = haystack.toLowerCase().includes(query.trim().toLowerCase());
          const levelMatch = levelFilter === "全部等级" || item.level === levelFilter;
          const timeMatch = daysAgo >= 0 && daysAgo <= timeWindowDays;
          return queryMatch && levelMatch && timeMatch;
        });

            project: addForm.project.trim(),

          setProjects((current) => current.map((project) => (
            project.id === editingId ? { ...project, ...editForm } : project
          )));
          setActionModal({
            title: "修改已保存",
            message: "当前项目的名称、借款人和保证人信息已更新完成。",
          });
        }

        async function importProjectsFromExcel(event) {
          const file = event.target.files && event.target.files[0];
          event.target.value = "";
          if (!file) return;

          try {
            const importedProjects = parseProjectExcel(await file.arrayBuffer());
            const existingKeys = new Set(projects.map(projectIdentity));
            const uploadKeys = new Set();
            const projectsToAdd = [];

            importedProjects.forEach((project) => {
              const key = projectIdentity(project);
              if (existingKeys.has(key) || uploadKeys.has(key)) return;
              uploadKeys.add(key);
              projectsToAdd.push(project);
            });

            if (projectsToAdd.length > 0) {
              setProjects((current) => [...projectsToAdd, ...current]);
              selectProject(projectsToAdd[0]);
            }

            const borrowers = new Set(projectsToAdd.map((project) => project.borrower).filter(Boolean)).size;
            const guarantors = new Set(projectsToAdd.map((project) => project.guarantor).filter(Boolean)).size;
            const skipped = importedProjects.length - projectsToAdd.length;

            setActionModal({
              type: "success",
              title: "Excel 上传成功",
              message: projectsToAdd.length
                ? `已成功添加 ${projectsToAdd.length} 个项目，涉及 ${borrowers} 个借款人、${guarantors} 个保证人。${skipped ? `另有 ${skipped} 条重复项目已跳过。` : ""}`
                : `模板读取成功，但项目均已存在，未重复添加。共跳过 ${skipped} 条重复项目。`,
            });
          } catch (error) {
            setActionModal({
              type: "error",
              title: "Excel 读取失败",
              message: error.message || "文件读取错误，请检查 Excel 模板后重试。",
            });
          }
        }

                  </div>
                </div>
